<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow — A beautiful, modern task management application. Organize your work, track progress, and stay productive." />
    <title>TaskFlow — Task Management</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
</head>
<body>

    <!-- Animated background pattern -->
    <div class="bg-pattern"></div>

    <!-- Toast notification container -->
    <div class="toast-container" id="toast-container"></div>


    <!-- ========================================
         AUTH VIEW — Login / Register
         ======================================== -->
    <div id="auth-view" class="auth-wrapper">
        <div class="auth-card">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <h1>TaskFlow</h1>
                <p>Organize your work, beautifully.</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" data-tab="login">Sign In</button>
                <button class="auth-tab" id="tab-register" data-tab="register">Create Account</button>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password" minlength="6" />
                </div>
                <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="hidden">
                <div class="form-group">
                    <label for="register-name">Name</label>
                    <input type="text" id="register-name" placeholder="Your name" required autocomplete="name" />
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="you@example.com" required autocomplete="email" />
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" placeholder="Min 6 characters" required autocomplete="new-password" minlength="6" />
                </div>
                <button type="submit" class="btn-primary" id="register-btn">Create Account</button>
            </form>

        </div>
    </div>


    <!-- ========================================
         DASHBOARD VIEW — Main App
         ======================================== -->
    <div id="dashboard-view" class="app-container hidden">

        <!-- Top Bar -->
        <header class="top-bar">
            <div class="brand">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <span class="brand-name">TaskFlow</span>
            </div>
            <div class="top-bar-actions">
                <div class="user-pill">
                    <div class="user-avatar" id="user-avatar">H</div>
                    <span class="user-name" id="user-name-display">User</span>
                </div>
                <button class="btn-icon" id="logout-btn" title="Sign out">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-row">
            <div class="stat-card stat-total">
                <div class="stat-label">Total Tasks</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card stat-done">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="stat-done">0</div>
            </div>
            <div class="stat-card stat-pending">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="stat-pending">0</div>
            </div>
        </div>

        <!-- Add Task -->
        <div class="task-input-area">
            <form class="task-input-row" id="add-task-form">
                <input type="text" id="task-input" placeholder="What needs to be done?" required maxlength="500" />
                <button type="submit" class="btn-add" id="add-task-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Task
                </button>
            </form>
        </div>

        <!-- Filters -->
        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="pending">Pending</button>
                <button class="filter-tab" data-filter="completed">Completed</button>
            </div>
            <select class="sort-select" id="sort-select">
                <option value="createdAt:desc">Newest first</option>
                <option value="createdAt:asc">Oldest first</option>
                <option value="description:asc">A → Z</option>
                <option value="description:desc">Z → A</option>
            </select>
        </div>

        <!-- Task List -->
        <div id="task-list" class="task-list">
            <!-- Tasks rendered by JS -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state hidden">
            <div class="empty-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                </svg>
            </div>
            <h3>No tasks yet</h3>
            <p>Add your first task above to get started!</p>
        </div>

        <!-- Loading -->
        <div id="loading-indicator" class="loading-container hidden">
            <div class="spinner"></div>
        </div>

        <!-- Load More -->
        <div id="load-more-area" class="load-more-area hidden">
            <button class="btn-load-more" id="load-more-btn">Load more tasks</button>
        </div>

        <!-- Keyboard hint -->
        <div class="keyboard-hint">
            Press <kbd>Enter</kbd> to add • <kbd>Esc</kbd> to clear
        </div>

    </div>

    <script src="/js/app.js"></script>
</body>
</html>
